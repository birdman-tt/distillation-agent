services:
  gateway:
    environment:
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-off}
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro

  h5:
    ports:
      - "${LOCAL_H5_PORT:-13100}:3100"

  api:
    depends_on:
      worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "${LOCAL_API_PORT:-13000}:3000"

  worker:
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${LOCAL_WORKER_PORT:-13001}:3001"

  migrate:
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hall_of_fame
      POSTGRES_USER: hof
      POSTGRES_PASSWORD: hof
    expose:
      - "5432"
    ports:
      - "${LOCAL_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hof -d hall_of_fame"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - internal

  minio:
    image: minio/minio:RELEASE.2025-02-03T21-03-04Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    ports:
      - "${LOCAL_MINIO_API_PORT:-19000}:9000"
      - "${LOCAL_MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_local_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

volumes:
  postgres_local_data:
  minio_local_data:
