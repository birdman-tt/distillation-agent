services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      h5:
        condition: service_healthy
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL:?set CADDY_EMAIL}
      CADDY_AUTO_HTTPS: ${CADDY_AUTO_HTTPS:-on}
      WEB_DOMAIN: ${WEB_DOMAIN:?set WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports:
      - "${GATEWAY_HTTP_PORT:-80}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - internal

  h5:
    image: ${HOF_H5_IMAGE:?set HOF_H5_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      H5_PORT: 3100
      APP_BASE_URL: ${APP_BASE_URL:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:?set PUBLIC_API_BASE_URL}
    expose:
      - "3100"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  api:
    image: ${HOF_API_IMAGE:?set HOF_API_IMAGE}
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_PORT: 3000
      APP_BASE_URL: ${APP_BASE_URL:-}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:?set PUBLIC_WEB_BASE_URL}
      WORKER_BASE_URL: ${WORKER_BASE_URL:-http://worker:3001}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      DEEPSEEK_REASONER_MODEL: ${DEEPSEEK_REASONER_MODEL:-deepseek-reasoner}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-https://api.minimaxi.com/v1}
      MINIMAX_PLANNER_MODEL: ${MINIMAX_PLANNER_MODEL:-MiniMax-M2.7}
      CHAT_PLANNER_ENABLED: ${CHAT_PLANNER_ENABLED:-false}
      CHAT_REALTIME_ENABLED: ${CHAT_REALTIME_ENABLED:-false}
      CHAT_PROACTIVE_ENABLED: ${CHAT_PROACTIVE_ENABLED:-false}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      RUN_DB_BOOTSTRAP_ON_STARTUP: ${RUN_DB_BOOTSTRAP_ON_STARTUP:-false}
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  worker:
    image: ${HOF_WORKER_IMAGE:?set HOF_WORKER_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      WORKER_PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?set S3_PUBLIC_ENDPOINT}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      DEEPSEEK_REASONER_MODEL: ${DEEPSEEK_REASONER_MODEL:-deepseek-reasoner}
      CHAT_PROACTIVE_ENABLED: ${CHAT_PROACTIVE_ENABLED:-false}
      CHAT_PROACTIVE_POLL_INTERVAL_MS: ${CHAT_PROACTIVE_POLL_INTERVAL_MS:-5000}
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/health').then((r)=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  migrate:
    image: ${HOF_MIGRATE_IMAGE:?set HOF_MIGRATE_IMAGE}
    profiles:
      - ops
    restart: "no"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_BASE_URL: ${APP_BASE_URL:-}
      PUBLIC_WEB_BASE_URL: ${PUBLIC_WEB_BASE_URL:?set PUBLIC_WEB_BASE_URL}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    command: ["node", "apps/api/dist/migrate.js"]
    networks:
      - internal

  redis:
    image: redis:8-alpine
    profiles:
      - redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - internal

networks:
  public:
  internal:

volumes:
  caddy_data:
  caddy_config:
  redis_data:
