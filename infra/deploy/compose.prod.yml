services:
  gateway:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  h5:
    pull_policy: always
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  api:
    pull_policy: always
    mem_limit: 1024m
    environment:
      LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  worker:
    pull_policy: always
    mem_limit: 1024m
    environment:
      LOG_LEVEL: info
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
